name: Jekyll Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Publishing is handled by the existing pages-build-deployment workflow.
# Keep this workflow as a build check instead of deploying the same site twice.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --trace --verbose
        env:
          JEKYLL_ENV: production
      - name: Test site structure
        run: |
          test -s _site/index.html
          test -s _site/about.html
          test -s _site/archive.html
          test -s _site/assets/css/main.css
          # 归档页回归检查：不能只测文件非空，还要测文章真的渲染进归档、
          # 且按年份分组的 <section> 已闭合（曾出现列表残缺/整页空白却仍通过检查）。
          grep -q "Start" _site/archive.html
          grep -q "Blush pink Heartbeat" _site/archive.html
          grep -q "</section>" _site/archive.html
          grep -q "js-tags" _site/archive.html
