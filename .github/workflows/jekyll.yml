name: Jekyll Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Publishing is handled by the existing pages-build-deployment workflow.
# Keep this workflow as a build check instead of deploying the same site twice.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --trace --verbose
        env:
          JEKYLL_ENV: production
      - name: Test site structure
        run: |
          test -s _site/index.html
          test -s _site/about.html
          test -s _site/archive.html
          test -s _site/assets/css/main.css
